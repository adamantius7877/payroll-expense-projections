services:
  postgres:
    image: postgres:17-alpine
    container_name: payroll-expense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payroll_expenses
      POSTGRES_USER: payroll_app
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-this-local-password}"
    volumes:
      - payroll_expense_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll_app -d payroll_expenses"]
      interval: 10s
      timeout: 5s
      retries: 5

  payroll-expense-projections:
    build:
      context: .
      dockerfile: Dockerfile
    image: payroll-expense-projections:latest
    container_name: payroll-expense-projections
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: payroll_expenses
      PGUSER: payroll_app
      PGPASSWORD: "${POSTGRES_PASSWORD:-change-this-local-password}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  payroll_expense_data:
